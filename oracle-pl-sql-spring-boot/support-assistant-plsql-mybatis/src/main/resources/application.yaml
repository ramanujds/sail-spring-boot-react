spring:
  application:
    name: support-assistant-plsql-mybatis

  datasource:
    # Oracle XE on your own machine. For another database, set DB_URL:
    # jdbc:oracle:thin:@//ORACLE_HOST:1521/ORACLE_SERVICE
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    # Set DB_USERNAME and DB_PASSWORD as environment variables. Do not write a password in this file.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mybatis:
  configuration:
    # Oracle needs a type for a null value. Without this, a null title or status fails with ORA-17004.
    jdbc-type-for-null: 'NULL'
    # MyBatis keeps the result of a SELECT for the rest of a transaction. A package call can change the data
    # without MyBatis knowing, so keep results only for one statement.
    local-cache-scope: statement
