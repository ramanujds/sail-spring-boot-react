server:
  port: 8000

spring:
  datasource:
    url: jdbc:h2:mem:testdb      # in-memory: data is lost when the app stops
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate         # schema.sql creates the table; Hibernate only checks it
  h2:
    console:
      enabled: true              # browse the data at /h2-console
