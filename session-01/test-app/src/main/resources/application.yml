server:
  port: 8000

# Default connection: the optional Docker container in docker-compose.yml.
#
# To use your locally installed Oracle 19c instead, do not edit this file.
# Fill in application-19c.yml and start the app with the "19c" profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=19c
spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: testapp
    password: ${DB_PASSWORD:testapp}   # local throwaway container
  jpa:
    hibernate:
      ddl-auto: validate
