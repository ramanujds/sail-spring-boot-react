services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    platform: linux/amd64   # image is amd64 only; runs under emulation on Apple Silicon
    container_name: testapp-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle     # SYS/SYSTEM password; local throwaway container
      APP_USER: testapp           # created by the image in XEPDB1
      APP_USER_PASSWORD: testapp
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db:/container-entrypoint-initdb.d:ro   # init.sql runs once, on first start

volumes:
  oracle-data:
